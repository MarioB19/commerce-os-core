# Standalone isolated staging only. No shared production networks, ports, credentials or gateways.
name: commerce-staging-soak
services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    env_file: ${STAGING_CONFIG_DIR:?private staging directory}/soak.env
    volumes: ['soak_pg:/var/lib/postgresql/data']
    networks: [isolated]
    mem_limit: ${STAGING_POSTGRES_MEMORY:-512m}
    cpus: 0.5
    command: ['postgres','-c','max_connections=20','-c','shared_buffers=32MB']
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  observer:
    image: ${STAGING_IMAGE:?immutable reviewed runtime digest}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp:size=32m,noexec,nosuid']
    env_file: ${STAGING_CONFIG_DIR}/soak.env
    command: ['node','--import','tsx','scripts/staging-soak.ts']
    networks: [isolated]
    mem_limit: 384m
    cpus: 0.4
    depends_on: {postgres: {condition: service_healthy}}
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
networks:
  isolated: {internal: true}
volumes:
  soak_pg:
