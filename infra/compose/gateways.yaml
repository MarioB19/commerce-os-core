# Prepared only. No gateway runs without an explicitly selected profile.
# Layer after production.yaml. Each slot has a private network, key and session volume.
x-gateway: &gateway
  restart: 'no'
  init: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  pids_limit: 100
  mem_limit: 256m
  cpus: 0.3
  stop_grace_period: 30s
  logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
services:
  waha-01:
    <<: *gateway
    image: devlikeapro/waha:gows-2026.8.2@${WAHA_GOWS_DIGEST:?verified GOWS sha256 digest required}
    profiles: [waha-gows, waha-01]
    env_file: ${COMMERCE_GATEWAY_CONFIG_DIR:?private gateway configuration directory}/waha-01.env
    environment: {WHATSAPP_DEFAULT_ENGINE: GOWS, WAHA_WORKER_ID: waha-01, WAHA_PRINT_QR: 'false', WAHA_DASHBOARD_ENABLED: 'false', WHATSAPP_SWAGGER_ENABLED: 'false'}
    volumes: ['waha-01-sessions:/app/.sessions']
    networks: [gateway-01]
