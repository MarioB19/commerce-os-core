[package]
name = "commerce-worker-desktop"
version = "0.1.1"
description = "Commerce Worker Experimental"
authors = ["Commerce OS"]
edition = "2021"
publish = false
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
